[project]
name = "maritime-rag"
version = "0.1.0"
description = "RAG Q&A over Indonesian maritime regulations and UNCTAD RMT with source citations"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "tokenizers>=0.23.3",
    "torch>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
maritime-ingest = "maritime_rag.ingest:main"
maritime-ocr-quality = "maritime_rag.ocr_report:main"
maritime-search = "maritime_rag.retrieval.cli:main"
maritime-index = "maritime_rag.retrieval.build:main"
maritime-smoke = "maritime_rag.retrieval.smoke:main"
maritime-ask = "maritime_rag.answer.cli:main"
maritime-answer-examples = "maritime_rag.answer.examples:main"
maritime-eval-questions = "maritime_rag.eval.questions:main"
maritime-eval-retrieval = "maritime_rag.eval.retrieval:main"
maritime-eval-answers = "maritime_rag.eval.answers:main"
maritime-eval-judge = "maritime_rag.eval.judge:main"
maritime-eval-report = "maritime_rag.eval.report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
