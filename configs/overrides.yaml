# Manual fixes for Pasal-header parsing errors that heuristics should not chase.
#
# Each entry is pinned to the SHA-256 (prefix) of the PDF it was written against. If the file
# changes, e.g. a scan is replaced by a born-digital copy, the entry is skipped and listed as
# "stale" in reports/ingest_stats.md, so remove it then.
#
#   doc_id       manifest doc
#   file_sha256  prefix of the file's SHA-256 (see reports/validation.md)
#   part         body | penjelasan
#   page         physical PDF page (1-based)
#   line         the extracted line exactly as the pipeline sees it
#   pasal        the Pasal label to force, or null if the line is not a header
#   reason       why

pasal_headers:
  - {doc_id: uu_17_2008, file_sha256: 3ab4cc456dfe, part: penjelasan, page: 163, line: 'Pasar 96', pasal: "96",
     reason: "typo 'Pasar' in the source PDF; Penjelasan of Pasal 96 was merged into Pasal 95"}
