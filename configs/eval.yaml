# Phase 4 evaluation config. The rules themselves are fixed in docs/eval_plan.md (written
# before any result); this file only holds paths and the parameters those rules name.

paths:
  chunks_file: data/processed/chunks.jsonl
  draft: data/eval/questions_draft.yaml          # drafted questions (source of the review workbook)
  draft_xlsx: data/eval/questions_draft.xlsx     # review workbook: decisions are made here
  gold_csv: data/eval/questions_gold.csv         # written by `maritime-eval-questions validate`

slices:                    # target sizes from the plan (validate warns when a slice drops below 80 %)
  factual_id: 25
  which_pasal: 7
  amended: 8
  english: 5
  out_of_scope: 10

review:
  decisions: [keep, edit, delete]
  shared_words_warn: 5     # auto_check warns when a question shares >= this many consecutive words with its gold text

seed: 42

retrieval:                 # Step 2 (docs/eval_plan.md section 2); local only, no LLM
  retrieval_config: configs/retrieval.yaml
  depth: 10                # each configuration returns its top 10 (MRR@10)
  hit_at: [1, 5]
  rerank_first_stage: 20   # hybrid+rerank reranks the hybrid top 20
  configs: [bm25, bm25_noheading, dense, hybrid, hybrid_rerank]
  simplicity: {bm25: 0, bm25_noheading: 0, dense: 1, hybrid: 2, hybrid_rerank: 3}
  selection_margin: 0.02   # simplest config with Hit@5 within this of the best
  bootstrap: {resamples: 2000, ci: 0.95}   # seed: `seed` in retrieval.yaml
  gate_thresholds: [0.005, 0.01, 0.02, 0.05, 0.1]
  gate_max_in_scope_refusals: 1
  output_json: reports/eval_retrieval.json
  output_md: reports/eval_retrieval.md

answers:                   # Step 3 (docs/eval_plan.md section 3 + post-hoc change 1)
  answer_config: configs/answer.yaml   # prompt, versions/sibling budget, LLM profiles (gate is forced off)
  llms: [groq, groq-qwen]
  selection_from: reports/eval_retrieval.json   # the retrieval configuration selected in Step 2
  contexts: data/eval/cache/contexts.json       # one context per question, shared by both LLMs
  cache_dir: data/eval/cache                    # answers_<llm>.jsonl, append-only, keyed (question, fingerprint, model, prompt version)
  correct_refusal_reasons: [no_hits, gate, model_not_found, no_valid_citation]   # truncated is not a correct refusal
  output_json: reports/eval_answers.json
  output_md: reports/eval_answers.md
  cost_estimate:           # `budget`, before answers exist (then actual tokens from the cache)
    chars_per_token: 3.0   # conservative: Groq tokenizers average about 3.3-4 chars per token on this corpus
    answer_output_tokens: 600        # incl. reasoning tokens (Phase 3: 11-906 per answer)
    judge_prompt_overhead_tokens: 800   # rubric + framing (Step 4)
    judge_output_tokens: 600
    stop_above_usd: 2.0
