<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink3" fill="#8a8984" x="20" y="174.0" font-size="10">judged by gpt-oss-120b</text>
<g><title>Qwen3.8-27B, Correctness: correct 40/44 (91%)</title>
<rect class="o1" fill="#184f95" x="210.0" y="144" width="425.3" height="26" rx="4"/></g>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="on1" fill="#ffffff" x="422.6" y="161.0" font-size="11" text-anchor="middle">40</text>
