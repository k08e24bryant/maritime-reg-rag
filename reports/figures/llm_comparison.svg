<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink2" fill="#52514e" x="688" y="161.0" font-size="11">40 / 2 / 2 of 44</text>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink2" fill="#52514e" x="20" y="206" font-size="12" font-weight="600">Faithfulness to cited sources</text>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink" fill="#0b0b0b" x="20" y="233.0" font-size="12">gpt-oss-120b</text>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink3" fill="#8a8984" x="20" y="246.0" font-size="10">judged by Qwen3.8-27B</text>
<g><title>gpt-oss-120b, Faithfulness to cited sources: supported 41/44 (93%)</title>
<rect class="o1" fill="#184f95" x="210.0" y="216" width="436.0" height="26" rx="4"/></g>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="on1" fill="#ffffff" x="428.0" y="233.0" font-size="11" text-anchor="middle">41</text>
