<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink2" fill="#52514e" x="688" y="233.0" font-size="11">41 / 2 / 1 of 44</text>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink" fill="#0b0b0b" x="20" y="271.0" font-size="12">Qwen3.8-27B</text>
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="ink3" fill="#8a8984" x="20" y="284.0" font-size="10">judged by gpt-oss-120b</text>
